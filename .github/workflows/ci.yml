name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ridehail
          POSTGRES_USER: ridehail
          POSTGRES_PASSWORD: ridehail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ridehail -d ridehail"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # With RIDEHAIL_TEST_PG_URL set, the suite also runs on real Postgres: Flyway migrations, schema
      # validation, ledger triggers, row locking. Without it those tests are skipped (local default).
      - name: Test (H2 and Postgres)
        env:
          RIDEHAIL_TEST_PG_URL: jdbc:postgresql://localhost:5432/ridehail
        run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ridehail-platform:ci .
      - name: Build admin panel image
        run: docker build -t ridehail-admin-web:ci admin-web

  # The admin panel is checked on its own: lint, types, unit tests (which include the API contract fixtures the backend
  # tests also check) and a production build.
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The real deployment shape: two application instances, RabbitMQ, Redis, Postgres and the nginx gateway. A rider and a
  # customer are connected to DIFFERENT instances and a ride is driven end to end (see scripts/verify-realtime.py).
  realtime-across-instances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install websocket-client
      - name: Start the stack
        env:
          LOCATION_RATE: "0.2"          # a low sustained rate so the shared rate limit is easy to see
        run: docker compose up --build -d --wait
      - name: Verify pushes and rate limits across instances
        run: python3 scripts/verify-realtime.py
      - name: Logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
