name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ridehail
          POSTGRES_USER: ridehail
          POSTGRES_PASSWORD: ridehail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ridehail -d ridehail"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # With RIDEHAIL_TEST_PG_URL set, the suite also runs on real Postgres: Flyway migrations, schema
      # validation, ledger triggers, row locking. Without it those tests are skipped (local default).
      - name: Test (H2 and Postgres)
        env:
          RIDEHAIL_TEST_PG_URL: jdbc:postgresql://localhost:5432/ridehail
        run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ridehail-platform:ci .
      - name: Build admin panel image
        run: docker build -t ridehail-admin-web:ci admin-web
      - name: Build the rider and customer web images
        run: |
          docker build -f clients/Dockerfile.web --build-arg APP=rider-web -t ridehail-rider-web:ci clients
          docker build -f clients/Dockerfile.web --build-arg APP=customer-web -t ridehail-customer-web:ci clients

  # The admin panel is checked on its own: lint, types, unit tests (which include the API contract fixtures the backend
  # tests also check) and a production build.
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The shared client package and the web apps built on it: types, unit tests, the API contract fixtures (which the
  # backend tests also check), then a whole ride through it against the real API over HTTP and STOMP WebSockets.
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: clients/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: npm ci
        working-directory: clients
      - run: npm run typecheck
        working-directory: clients
      - run: npm test
        working-directory: clients
      - name: Rider web app, lint and production build
        run: npm run lint --workspace ridehail-rider-web && npm run build --workspace ridehail-rider-web
        working-directory: clients
      - name: Customer web app, lint and production build
        run: npm run lint --workspace ridehail-customer-web && npm run build --workspace ridehail-customer-web
        working-directory: clients
      - name: Rider phone app, bundled for iOS and Android
        run: CI=1 npx expo export --platform ios --platform android --output-dir /tmp/rider-dist
        working-directory: clients/apps/rider-mobile
      - name: Customer phone app, bundled for iOS and Android
        run: CI=1 npx expo export --platform ios --platform android --output-dir /tmp/customer-dist
        working-directory: clients/apps/customer-mobile
      - name: A ride through the shared client against the running API
        run: |
          mvn -B -q -DskipTests spring-boot:run > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs localhost:8080/actuator/health | grep -q UP && break; sleep 3; done
          curl -fs localhost:8080/actuator/health || { cat api.log; exit 1; }
          cd clients && RIDEHAIL_E2E_URL=http://localhost:8080 npm test --workspace @ridehail/api

  # The real deployment shape: two application instances, RabbitMQ, Redis, Postgres and the nginx gateway. A rider and a
  # customer are connected to DIFFERENT instances and a ride is driven end to end (see scripts/verify-realtime.py).
  realtime-across-instances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install websocket-client
      - name: Start the stack
        env:
          LOCATION_RATE: "0.2"          # a low sustained rate so the shared rate limit is easy to see
        run: docker compose up --build -d --wait
      - name: Verify pushes and rate limits across instances
        run: python3 scripts/verify-realtime.py
      - name: Logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
