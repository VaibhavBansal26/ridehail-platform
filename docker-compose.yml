# The whole platform with TWO application instances, to run and test realtime across servers:
#   docker compose up --build
#
#   http://localhost:8080  gateway (nginx): spreads REST and WebSocket connections over both instances
#   http://localhost:8081  instance A directly      http://localhost:8082  instance B directly   (loopback only)
#   http://localhost:3000  admin web panel (sign in as "admin" with ADMIN_PASSWORD, dev default: dev-admin-password)
#                          DEMO_DATA=true docker compose up --build   loads a demo city so the panel has something to show
#
# Postgres is the system of record. RabbitMQ (STOMP) carries realtime pushes between instances, so a user connected to B is
# reached by something that happens on A. Redis holds the rate-limit counters so limits hold across both. RabbitMQ and Redis
# are NOT published to the host: only the application talks to them.
# Development credentials and the simulated payment gateway: not for production.
name: ridehail-platform

x-app: &app
  build: .
  image: ridehail-platform:compose
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  networks:
    default:
      aliases:
        - app            # every instance answers to "app"; the gateway balances across whatever is running
  environment: &app-env
    SPRING_PROFILES_ACTIVE: docker
    DB_URL: jdbc:postgresql://postgres:5432/ridehail
    DB_USER: ridehail
    DB_PASSWORD: ridehail
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:-ridehail-dev}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ridehail
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ridehail-dev}
    RIDEHAIL_TRACKING_LOCATIONUPDATESPERSECOND: ${LOCATION_RATE:-1.0}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ridehail
      POSTGRES_USER: ridehail
      POSTGRES_PASSWORD: ridehail
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridehail -d ridehail"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ridehail-dev}", "--save", "", "--appendonly", "no"]   # counters only: no persistence needed
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ridehail-dev}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ridehail
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ridehail-dev}
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro      # turns on the STOMP plugin (port 61613)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "61613"]
      interval: 5s
      timeout: 10s
      retries: 20

  app-a:
    <<: *app
    environment:
      <<: *app-env
      # DEMO_DATA=true fills the database with a believable city for the admin panel. Only this instance does it: two
      # instances starting together on an empty database would both try.
      RIDEHAIL_DEMO_DATA_ENABLED: ${DEMO_DATA:-false}
    ports:
      - "127.0.0.1:${APP_A_PORT:-8081}:8080"

  app-b:
    <<: *app
    ports:
      - "127.0.0.1:${APP_B_PORT:-8082}:8080"

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -q UP"]    # healthy = it can reach an instance
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${APP_PORT:-8080}:80"

  # The operations console. It talks to the API through the gateway, server to server; the browser only ever talks to it.
  admin:
    build: ./admin-web
    image: ridehail-admin-web:compose
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      BACKEND_URL: http://gateway
      ALLOW_INSECURE_COOKIES: "true"     # this stack is served over plain http on localhost; production must leave this unset
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:3000"

volumes:
  pgdata:
