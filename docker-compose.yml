# Runs the API with a real Postgres (Flyway migrations, schema validation, simulated payment gateway, dev secrets).
#   docker compose up --build
# API on http://localhost:8080 (APP_PORT), Postgres on localhost:5432 (POSTGRES_PORT). Not for production.
name: ridehail-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ridehail
      POSTGRES_USER: ridehail
      POSTGRES_PASSWORD: ridehail
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridehail -d ridehail"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/ridehail
      DB_USER: ridehail
      DB_PASSWORD: ridehail
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
