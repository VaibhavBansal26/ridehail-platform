# Gateway in front of the application instances: spreads REST calls and WebSocket connections across them.
# Realtime does NOT depend on this: a push reaches a user on whichever instance they are connected to, via RabbitMQ.
events {}

http {
    # needed so WebSocket upgrades are passed through and ordinary requests are not
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's DNS answers "app" with the address of every running instance. Using a variable in proxy_pass makes nginx look
    # the name up again (at most every 5 s) instead of once at startup, so restarted or replaced instances are picked up and a
    # stopped one drops out, with no gateway restart.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        set $ridehail http://app:8080;

        location /ws {
            proxy_pass $ridehail;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;      # an idle WebSocket is kept alive by STOMP heartbeats
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass $ridehail;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503;   # an instance that just went away: try another
        }
    }
}
