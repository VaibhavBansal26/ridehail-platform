# Scrapes both application instances' metrics port (never published outside the compose network) and loads the alert rules.
# Alerts need an Alertmanager (or your platform's equivalent) to reach a person: point `alerting` at it, see docs/DEPLOYMENT.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ridehail-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-a:9090", "app-b:9090"]
