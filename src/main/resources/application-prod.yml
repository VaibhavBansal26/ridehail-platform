spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ridehail}
    username: ${DB_USER:ridehail}
    password: ${DB_PASSWORD:ridehail}
  jpa:
    hibernate:
      ddl-auto: validate   # the schema is owned by Flyway migrations; the app only checks it matches the entities
  flyway:
    enabled: true

ridehail:
  security:
    jwt-secret: ${JWT_SECRET}            # no default: the app refuses to start without it
    allowed-origins: ${ALLOWED_ORIGINS}  # comma-separated, e.g. https://admin.example.com
    bootstrap-admin:
      password: ${ADMIN_PASSWORD}
  realtime:
    broker: ${REALTIME_BROKER:relay}       # relay = RabbitMQ, required when more than one instance runs
    relay:
      host: ${RABBITMQ_HOST:}              # no usable defaults: with broker=relay, startup fails naming what is missing
      virtual-host: ${RABBITMQ_VHOST:/}
      system-login: ${RABBITMQ_USER:}
      system-passcode: ${RABBITMQ_PASSWORD:}
      client-login: ${RABBITMQ_USER:}
      client-passcode: ${RABBITMQ_PASSWORD:}
  ratelimit:
    store: ${RATELIMIT_STORE:redis}        # redis = limits shared by every instance (REDIS_HOST, REDIS_PASSWORD)
  payments:
    gateway: stripe   # the simulated gateway never loads in prod
  stripe:
    api-key: ${STRIPE_API_KEY}                 # no defaults: startup fails fast if any is missing
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY}
