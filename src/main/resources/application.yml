spring:
  application:
    name: ridehail-platform
  datasource:
    url: jdbc:h2:mem:ridehail;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false   # dev/tests use in-memory H2 with generated tables; Postgres profiles turn migrations on

  data:
    redis:
      # only used when ridehail.ratelimit.store=redis; short timeouts so a slow Redis can never slow a request down
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 200ms
      connect-timeout: 500ms

server:
  shutdown: graceful                    # a rolling deploy lets in-flight requests finish instead of cutting them off
  forward-headers-strategy: framework   # behind a load balancer or gateway: honour X-Forwarded-For/-Proto

spring.lifecycle.timeout-per-shutdown-phase: 25s

management:
  health:
    redis:
      enabled: false   # a Redis outage must not mark an instance unhealthy: rate limiting degrades to per-instance by itself
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # lets Prometheus compute p95/p99 request times (see docker/prometheus/alerts.yml)

ridehail:
  security:
    # DEV ONLY default. Production must supply JWT_SECRET (>= 32 bytes), see application-prod.yml.
    jwt-secret: dev-only-secret-change-me-dev-only-secret-change-me
    access-ttl-minutes: 15
    refresh-ttl-days: 7
    allowed-origins:
      - "http://localhost:*"
    bootstrap-admin:
      phone: admin
      password: ${ADMIN_PASSWORD:dev-admin-password}
  login-limit:
    burst: 5          # attempts per phone number at once ...
    per-minute: 1     # ... then one more per minute: about 1,400 guesses a day per account instead of unlimited
  pricing:
    currency: USD
    quote-ttl-seconds: 120
    road-factor: 1.3
    avg-speed-kmh: 25
    rates:
      BIKE:  { base: 0.80, per-km: 0.40, per-min: 0.08, minimum: 2.00 }
      AUTO:  { base: 1.00, per-km: 0.60, per-min: 0.10, minimum: 2.50 }
      SEDAN: { base: 1.50, per-km: 0.90, per-min: 0.15, minimum: 4.00 }
      SUV:   { base: 2.50, per-km: 1.30, per-min: 0.20, minimum: 6.00 }
    surge:
      radius-km: 3.0
      demand-window-minutes: 10
      threshold: 1.0      # demand/supply ratio at which surge starts
      slope: 0.5          # extra multiplier per unit of ratio above threshold
      max-multiplier: 3.0
  stripe:
    # Only used when ridehail.payments.gateway=stripe. Keys come from the environment, never from git.
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}       # comma-separated: one whsec_ per Stripe webhook endpoint
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}   # handed to the mobile SDK for card setup
    api-base:                                       # blank = https://api.stripe.com (override only in tests)
    max-network-retries: 2                          # safe: every call carries an idempotency key
    connect-country:                                # e.g. US; blank = the platform account's country
    onboarding-return-url: ${STRIPE_ONBOARDING_RETURN_URL:ridehail://payouts/done}
    onboarding-refresh-url: ${STRIPE_ONBOARDING_REFRESH_URL:ridehail://payouts/retry}
    card-return-url: ${STRIPE_CARD_RETURN_URL:ridehail://card/done}
    card-cancel-url: ${STRIPE_CARD_CANCEL_URL:ridehail://card/cancelled}
  notifications:
    # Phone notifications for when the app is closed. "none" sends nothing (development); "expo" sends through Expo's push service.
    provider: ${PUSH_PROVIDER:none}
    expo-access-token: ${EXPO_ACCESS_TOKEN:}    # only if you turned on "enhanced security" for push in your Expo project
    max-devices-per-account: 10
  payments:
    gateway: fake   # fake | stripe
    commission-rate: 0.20
    min-payout: 5.00
    max-attempts: 8             # genuine provider errors (timeouts, outages) before a human has to look
    retry-backoff-seconds: 30   # first retry delay; doubles each time ...
    retry-backoff-max-seconds: 1800   # ... up to this cap (so 8 attempts span about an hour)
    funds-poll-seconds: 900     # payout waiting for settled platform funds: look again this often (no attempt used)
    funds-max-wait-days: 10     # ... and give up waiting after this long (card funds normally clear in 2-7 days)
    lease-seconds: 120        # how long an in-flight attempt blocks other workers
    retry-scan-ms: 5000
  disputes:
    loss-policy: platform   # who absorbs a dispute we lose: platform (rider keeps earnings) | rider (rider's share is taken back)
  realtime:
    broker: simple       # simple | relay. Use relay (RabbitMQ) whenever more than one instance runs.
    relay:               # used only when broker=relay; RabbitMQ with the rabbitmq_stomp plugin
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_STOMP_PORT:61613}
      virtual-host: ${RABBITMQ_VHOST:/}
      system-login: ${RABBITMQ_USER:ridehail}
      system-passcode: ${RABBITMQ_PASSWORD:ridehail}
      client-login: ${RABBITMQ_USER:ridehail}
      client-passcode: ${RABBITMQ_PASSWORD:ridehail}
  ratelimit:
    store: memory        # memory | redis. Use redis whenever more than one instance runs.
    redis-cool-off: 5s   # after a Redis failure, use local counters for this long before trying Redis again
  tracking:
    location-updates-per-second: 1.0   # sustained rate a rider app may report its position
    location-burst: 5                  # short bursts allowed above that
    push-min-interval-ms: 2000         # a customer is sent at most one position per trip every 2 seconds
  dispatch:
    offer-ttl-seconds: 15
    search-radius-km: 5.0
    max-offers-per-trip: 5
    expiry-scan-ms: 2000
